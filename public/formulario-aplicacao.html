<!--
  Formulário de aplicação — Ascensão Titã
  ======================================

  Bloco pra colar no WordPress, na página /preencha-o-formulario/, no lugar do
  formulário atual: copie TUDO daqui e cole num bloco "HTML personalizado"
  (Gutenberg) ou num widget "HTML" (Elementor). Não depende de plugin,
  biblioteca nem fonte externa, e entra no meio da página como qualquer outro
  bloco — sem fundo próprio e sem tomar a tela.

  COMO ELE SE LIGA AO LEAD QUE JÁ EXISTE
  --------------------------------------
  O popup da página anterior já mandou nome, e-mail e WhatsApp pro CRM. Este
  formulário manda as RESPOSTAS junto do mesmo WhatsApp, e o CRM identifica a
  pessoa pelo telefone — vira atualização do mesmo lead, não um lead novo.

  Pra ele saber quem é a pessoa sem perguntar de novo, o popup precisa passar os
  dados no endereço do redirecionamento. No Elementor, em "Ações após enviar" →
  "Redirecionar", use:

      https://ascensaotita.com/preencha-o-formulario/?nome=[field id="name"]&email=[field id="email"]&whatsapp=[field id="tel"]

  (troque os `id` pelos ids reais dos campos do seu formulário).

  Se por algum motivo o endereço vier sem esses dados, o formulário pergunta
  nome e WhatsApp numa primeira tela — ninguém fica de fora.

  PERGUNTAS
  ---------
  Estão na lista PERGUNTAS, logo no começo do <script>. Pra acrescentar,
  remover ou reordenar, mexa só ali: cada item tem `chave` (o nome do campo no
  CRM), `titulo` e `opcoes`.
-->

<div id="aplicacao-titan" class="aplic">
  <div class="aplic__cartao" role="form" aria-labelledby="aplic-titulo">
    <div class="aplic__barra"><span class="aplic__barra-progresso" id="aplic-progresso"></span></div>

    <div class="aplic__topo">
      <span class="aplic__marca">ASCENSÃO TITÃ</span>
      <span class="aplic__contador" id="aplic-contador"></span>
    </div>

    <div class="aplic__palco" id="aplic-palco" aria-live="polite"></div>

    <div class="aplic__rodape">
      <button type="button" class="aplic__voltar" id="aplic-voltar">← Voltar</button>
      <span class="aplic__aviso" id="aplic-aviso"></span>
      <button type="button" class="aplic__avancar" id="aplic-avancar">Continuar →</button>
    </div>
  </div>
</div>

<style>
  /* Tudo escopado em #aplicacao-titan pra não vazar no tema do WordPress. */
  #aplicacao-titan {
    --ouro: #c9a227;
    --ouro-claro: #e8c85a;
    --fundo: #0d0f12;
    --cartao: #14171c;
    --linha: rgba(255, 255, 255, 0.10);
    --texto: #f2f2f0;
    --texto-fraco: #a7a7a2;
    --erro: #e5675c;

    /*
     * EMBED: entra dentro da página, não toma a tela.
     *
     * Sem fundo próprio e sem altura de tela cheia — o fundo é o da página do
     * WordPress, e o bloco ocupa só o espaço que precisa, no lugar onde for
     * colado. Se a sua página for clara, troque --cartao, --texto e --linha
     * logo acima.
     */
    background: transparent;
    color: var(--texto);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    width: 100%;
    box-sizing: border-box;
  }
  #aplicacao-titan *,
  #aplicacao-titan *::before,
  #aplicacao-titan *::after { box-sizing: border-box; }

  #aplicacao-titan .aplic__cartao {
    width: 100%;
    max-width: 660px;
    margin: 0 auto;
    background: var(--cartao);
    border: 1px solid var(--linha);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 70px -40px rgba(0, 0, 0, 0.9);
  }

  #aplicacao-titan .aplic__barra { height: 3px; background: rgba(255, 255, 255, 0.07); }
  #aplicacao-titan .aplic__barra-progresso {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--ouro), var(--ouro-claro));
    transition: width 0.35s ease;
  }

  #aplicacao-titan .aplic__topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px 0;
  }
  #aplicacao-titan .aplic__marca {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--ouro);
    font-weight: 700;
  }
  #aplicacao-titan .aplic__contador { font-size: 11px; color: var(--texto-fraco); letter-spacing: 0.08em; }

  #aplicacao-titan .aplic__palco {
    padding: 18px 22px 6px;
    /* Altura mínima: sem isso o bloco encolhe e cresce a cada pergunta, e a
       página inteira dá um pulo embaixo dele a cada resposta. */
    min-height: 330px;
  }

  #aplicacao-titan .aplic__pergunta {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 3.4vw, 26px);
    line-height: 1.32;
    font-weight: 400;
    margin: 6px 0 4px;
  }
  #aplicacao-titan .aplic__ajuda { font-size: 13px; color: var(--texto-fraco); margin: 0 0 18px; line-height: 1.5; }

  #aplicacao-titan .aplic__opcoes { display: grid; gap: 10px; margin: 0 0 6px; }
  @media (min-width: 620px) {
    #aplicacao-titan .aplic__opcoes--duas { grid-template-columns: 1fr 1fr; }
  }

  #aplicacao-titan .aplic__opcao {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--linha);
    border-radius: 12px;
    color: var(--texto);
    font: inherit;
    font-size: 15px;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
  }
  #aplicacao-titan .aplic__opcao:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(201, 162, 39, 0.45); }
  #aplicacao-titan .aplic__opcao:active { transform: scale(0.995); }
  #aplicacao-titan .aplic__opcao[aria-pressed="true"] {
    border-color: var(--ouro);
    background: rgba(201, 162, 39, 0.12);
  }
  #aplicacao-titan .aplic__marcador {
    width: 18px;
    height: 18px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    flex-shrink: 0;
    position: relative;
  }
  #aplicacao-titan .aplic__opcao[aria-pressed="true"] .aplic__marcador { border-color: var(--ouro); }
  #aplicacao-titan .aplic__opcao[aria-pressed="true"] .aplic__marcador::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--ouro);
  }
  #aplicacao-titan .aplic__tecla {
    font-size: 11px;
    color: var(--texto-fraco);
    border: 1px solid var(--linha);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: auto;
    flex-shrink: 0;
  }
  @media (max-width: 619px) { #aplicacao-titan .aplic__tecla { display: none; } }

  #aplicacao-titan .aplic__campo { display: block; margin-bottom: 14px; }
  #aplicacao-titan .aplic__rotulo {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--texto-fraco);
    margin-bottom: 6px;
  }
  #aplicacao-titan .aplic__entrada {
    width: 100%;
    padding: 13px 15px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--linha);
    border-radius: 11px;
    color: var(--texto);
    font: inherit;
    font-size: 16px; /* 16px evita o zoom automático do iOS ao focar */
  }
  #aplicacao-titan .aplic__entrada:focus { outline: none; border-color: var(--ouro); background: rgba(255, 255, 255, 0.06); }
  #aplicacao-titan .aplic__entrada::placeholder { color: rgba(255, 255, 255, 0.28); }

  /* Armadilha pra robô: fora da tela, sem display:none (robô ignora escondido). */
  #aplicacao-titan .aplic__armadilha {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  #aplicacao-titan .aplic__rodape {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px 20px;
  }
  #aplicacao-titan .aplic__voltar,
  #aplicacao-titan .aplic__avancar {
    font: inherit;
    font-size: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease, filter 0.15s ease;
  }
  #aplicacao-titan .aplic__voltar {
    background: none;
    border: none;
    color: var(--texto-fraco);
    padding: 10px 4px;
  }
  #aplicacao-titan .aplic__voltar:hover { color: var(--texto); }
  #aplicacao-titan .aplic__avancar {
    margin-left: auto;
    background: linear-gradient(180deg, var(--ouro-claro), var(--ouro));
    border: none;
    color: #17140a;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 12px 24px;
  }
  #aplicacao-titan .aplic__avancar:hover { filter: brightness(1.06); }
  #aplicacao-titan .aplic__avancar[disabled] { opacity: 0.45; cursor: default; filter: none; }
  #aplicacao-titan .aplic__aviso { font-size: 12.5px; color: var(--erro); }

  #aplicacao-titan .aplic__fim { text-align: center; padding: 26px 6px 18px; }
  #aplicacao-titan .aplic__selo {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1px solid var(--ouro);
    color: var(--ouro);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 14px;
  }
  #aplicacao-titan .aplic__fim h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 24px;
    margin: 0 0 10px;
  }
  #aplicacao-titan .aplic__fim p { color: var(--texto-fraco); font-size: 14.5px; line-height: 1.6; margin: 0 auto; max-width: 420px; }

  #aplicacao-titan .aplic__resumo {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    color: var(--texto-fraco);
    padding: 0 22px 10px;
  }
  #aplicacao-titan .aplic__trocar {
    background: none;
    border: none;
    color: var(--ouro);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
</style>

<script>
(function () {
  'use strict';

  // ── Onde as respostas são gravadas ────────────────────────────────────────
  var ENDERECO_CRM = 'https://titacrm.vercel.app/api/public/aplicacao';

  // Pra onde mandar depois de concluir. Vazio = fica na tela de agradecimento.
  var REDIRECIONAR_APOS = '';

  /*
   * As perguntas. `chave` é o nome do campo no CRM — mudar uma chave depois faz
   * as respostas antigas e novas ficarem em campos diferentes, então só mude se
   * for isso mesmo que você quer. `area`, `aumento` e `investimento` têm o mesmo
   * nome das perguntas equivalentes da Agenda, de propósito: assim a resposta
   * cai na mesma coluna, não importa por onde a pessoa entrou.
   */
  var PERGUNTAS = [
    {
      chave: 'area',
      titulo: 'Qual a sua área de atuação profissional?',
      colunas: 2,
      opcoes: ['Empresário', 'Profissional Autônomo', 'CLT', 'Outro'],
    },
    {
      chave: 'aumento',
      titulo: 'Em quanto irá AUMENTAR seu faturamento mensal nos próximos 6 meses se você alcançar maior eficiência e produtividade?',
      colunas: 2,
      opcoes: [
        'Mais de R$50.000/mês',
        'R$25.000-R$50.000/mês',
        'R$10.000-R$25.000/mês',
        'R$1.000-R$10.000/mês',
        'Menos de R$1.000/mês',
      ],
    },
    {
      chave: 'investimento',
      titulo: 'Quanto você investiu em imersões, cursos, treinamentos, mentorias e outros programas de desenvolvimento no último ano?',
      colunas: 2,
      opcoes: [
        'Mais de R$50.000',
        'R$31.000 à R$50.000',
        'R$16.000 à R$30.000',
        'R$5.000 à R$15.000',
        'Até R$4.000',
        'Não fiz esse tipo de investimento',
      ],
    },
    {
      chave: 'objetivo_profissional',
      titulo: 'O que você deseja alcançar com sua vida profissional nos próximos 12 meses?',
      colunas: 1,
      opcoes: [
        'Reconhecimento - Ter tempo para desenvolver habilidades que farão eu me destacar como profissional, ser reconhecido e me tornar uma referência no mercado em que atuo',
        'Dinheiro - Quero ser mais produtivo e eficiente com minhas atividades profissionais para conseguir aumentar minhas fontes de renda e/ou meu faturamento',
        'Liberdade - Me sinto preso às minhas demandas e imprevistos. Quero ter um controle maior dos meus compromissos e rotina de modo a ter mais liberdade para escolher o que eu vou fazer com o meu tempo',
        'Outro',
      ],
    },
    {
      chave: 'qualidade_vida',
      titulo: 'O que você deseja alcançar em termos de Qualidade de Vida nos próximos 12 meses?',
      colunas: 1,
      opcoes: [
        'Relacionamentos - Quero ter mais tempo de qualidade para ficar com as pessoas que são importantes para mim',
        'Saúde - Quero ter mais tempo para cuidar da minha saúde, praticar atividade física com consistência, cuidar mais da minha alimentação e ter maior qualidade de sono',
        'Hobbies - Quero ter mais tempo para praticar hobbies, viajar, estudar áreas que tenho interesse e/ou tirar um projeto que está na gaveta há muito tempo',
        'Outro',
      ],
    },
    {
      chave: 'acompanhante',
      titulo: 'Você tem algum acompanhante que gostaria de convidar para participar da imersão com você?',
      colunas: 2,
      opcoes: ['Sim', 'Não'],
    },
  ];

  var CHAVE_MEMORIA = 'aplicacao-titan';

  var palco = document.getElementById('aplic-palco');
  var progresso = document.getElementById('aplic-progresso');
  var contador = document.getElementById('aplic-contador');
  var botaoVoltar = document.getElementById('aplic-voltar');
  var botaoAvancar = document.getElementById('aplic-avancar');
  var aviso = document.getElementById('aplic-aviso');

  var estado = {
    passo: 0,
    identidade: { nome: '', email: '', whatsapp: '' },
    respostas: {},
    enviando: false,
    concluido: false,
  };

  // ── De onde vêm nome/e-mail/WhatsApp ─────────────────────────────────────
  // 1) o endereço (o popup passa no redirecionamento);
  // 2) o que ficou guardado numa visita anterior;
  // 3) a própria pessoa, na primeira tela, se as duas de cima falharem.
  function lerIdentidade() {
    var url = new URLSearchParams(window.location.search);
    var pega = function (nomes) {
      for (var i = 0; i < nomes.length; i++) {
        var valor = url.get(nomes[i]);
        if (valor && valor.trim() && valor.indexOf('[field') === -1) return valor.trim();
      }
      return '';
    };
    var daUrl = {
      nome: pega(['nome', 'name', 'first_name']),
      email: pega(['email', 'e-mail']),
      whatsapp: pega(['whatsapp', 'tel', 'telefone', 'phone']),
    };
    var guardado = {};
    try {
      guardado = JSON.parse(localStorage.getItem(CHAVE_MEMORIA) || '{}');
    } catch (e) {}
    return {
      nome: daUrl.nome || guardado.nome || '',
      email: daUrl.email || guardado.email || '',
      whatsapp: daUrl.whatsapp || guardado.whatsapp || '',
    };
  }

  function guardar() {
    try {
      localStorage.setItem(
        CHAVE_MEMORIA,
        JSON.stringify({
          nome: estado.identidade.nome,
          email: estado.identidade.email,
          whatsapp: estado.identidade.whatsapp,
          respostas: estado.respostas,
        })
      );
    } catch (e) {}
  }

  function soDigitos(texto) { return String(texto || '').replace(/\D/g, ''); }

  function telefoneValido(texto) {
    var n = soDigitos(texto).length;
    return n >= 10 && n <= 15;
  }

  /** (11) 91234-5678 enquanto digita — só pra ficar legível. */
  function formatarTelefone(texto) {
    var d = soDigitos(texto).slice(0, 11);
    if (d.length <= 2) return d;
    if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  }

  // A tela de identidade só existe quando falta nome ou WhatsApp.
  function precisaPerguntarIdentidade() {
    return !(estado.identidade.nome.trim().length > 1 && telefoneValido(estado.identidade.whatsapp));
  }

  function totalDePassos() { return PERGUNTAS.length + (precisaPerguntarIdentidade() ? 1 : 0); }

  function perguntaDoPasso() {
    var deslocamento = precisaPerguntarIdentidade() ? 1 : 0;
    return PERGUNTAS[estado.passo - deslocamento] || null;
  }

  function mostrandoIdentidade() { return precisaPerguntarIdentidade() && estado.passo === 0; }

  // ── Desenho ──────────────────────────────────────────────────────────────
  function desenhar() {
    aviso.textContent = '';
    if (estado.concluido) return desenharFim();

    var total = totalDePassos();
    progresso.style.width = Math.round(((estado.passo) / total) * 100) + '%';
    contador.textContent = 'Pergunta ' + (estado.passo + 1) + ' de ' + total;
    botaoVoltar.style.visibility = estado.passo === 0 ? 'hidden' : 'visible';
    botaoAvancar.textContent = estado.passo === total - 1 ? 'Enviar aplicação' : 'Continuar →';
    botaoAvancar.disabled = false;

    palco.innerHTML = '';
    if (mostrandoIdentidade()) return desenharIdentidade();
    desenharPergunta(perguntaDoPasso());
  }

  function desenharIdentidade() {
    var titulo = document.createElement('h2');
    titulo.className = 'aplic__pergunta';
    titulo.id = 'aplic-titulo';
    titulo.textContent = 'Antes de começar, confirme seus dados';
    var ajuda = document.createElement('p');
    ajuda.className = 'aplic__ajuda';
    ajuda.textContent = 'É por aqui que a nossa equipe fala com você sobre a imersão.';
    palco.appendChild(titulo);
    palco.appendChild(ajuda);

    palco.appendChild(campoTexto('Seu nome', 'nome', 'text', 'Nome completo'));
    palco.appendChild(campoTexto('Seu WhatsApp', 'whatsapp', 'tel', '(11) 91234-5678'));
    palco.appendChild(campoTexto('Seu e-mail (opcional)', 'email', 'email', 'voce@email.com'));

    var primeiro = palco.querySelector('input');
    if (primeiro) primeiro.focus();
  }

  function campoTexto(rotulo, chave, tipo, exemplo) {
    var caixa = document.createElement('label');
    caixa.className = 'aplic__campo';
    var titulo = document.createElement('span');
    titulo.className = 'aplic__rotulo';
    titulo.textContent = rotulo;
    var entrada = document.createElement('input');
    entrada.className = 'aplic__entrada';
    entrada.type = tipo;
    entrada.value = estado.identidade[chave] || '';
    entrada.placeholder = exemplo;
    if (chave === 'whatsapp') {
      entrada.inputMode = 'tel';
      entrada.value = formatarTelefone(entrada.value);
    }
    entrada.addEventListener('input', function () {
      if (chave === 'whatsapp') entrada.value = formatarTelefone(entrada.value);
      estado.identidade[chave] = entrada.value;
      guardar();
    });
    entrada.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); avancar(); }
    });
    caixa.appendChild(titulo);
    caixa.appendChild(entrada);
    return caixa;
  }

  function desenharPergunta(pergunta) {
    if (!pergunta) return;

    if (estado.identidade.nome) {
      var resumo = document.createElement('div');
      resumo.className = 'aplic__resumo';
      var quem = document.createElement('span');
      quem.textContent = estado.identidade.nome.split(' ')[0] + ' · ' + formatarTelefone(estado.identidade.whatsapp);
      var trocar = document.createElement('button');
      trocar.type = 'button';
      trocar.className = 'aplic__trocar';
      trocar.textContent = 'não é você?';
      trocar.addEventListener('click', function () {
        estado.identidade = { nome: '', email: '', whatsapp: '' };
        estado.passo = 0;
        guardar();
        desenhar();
      });
      resumo.appendChild(quem);
      resumo.appendChild(trocar);
      palco.appendChild(resumo);
    }

    var titulo = document.createElement('h2');
    titulo.className = 'aplic__pergunta';
    titulo.id = 'aplic-titulo';
    titulo.textContent = pergunta.titulo;
    palco.appendChild(titulo);

    if (pergunta.ajuda) {
      var ajuda = document.createElement('p');
      ajuda.className = 'aplic__ajuda';
      ajuda.textContent = pergunta.ajuda;
      palco.appendChild(ajuda);
    }

    var lista = document.createElement('div');
    lista.className = 'aplic__opcoes' + (pergunta.colunas === 2 ? ' aplic__opcoes--duas' : '');
    pergunta.opcoes.forEach(function (opcao, indice) {
      var botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'aplic__opcao';
      botao.setAttribute('aria-pressed', estado.respostas[pergunta.chave] === opcao ? 'true' : 'false');

      var marcador = document.createElement('span');
      marcador.className = 'aplic__marcador';
      var texto = document.createElement('span');
      texto.textContent = opcao;
      botao.appendChild(marcador);
      botao.appendChild(texto);

      if (indice < 9) {
        var tecla = document.createElement('span');
        tecla.className = 'aplic__tecla';
        tecla.textContent = String(indice + 1);
        botao.appendChild(tecla);
      }

      botao.addEventListener('click', function () { escolher(pergunta.chave, opcao); });
      lista.appendChild(botao);
    });
    palco.appendChild(lista);
  }

  function desenharFim() {
    progresso.style.width = '100%';
    contador.textContent = '';
    botaoVoltar.style.visibility = 'hidden';
    botaoAvancar.style.display = 'none';
    aviso.textContent = '';
    palco.innerHTML =
      '<div class="aplic__fim">' +
      '<div class="aplic__selo">✓</div>' +
      '<h2>Aplicação enviada</h2>' +
      '<p>Recebemos suas respostas. Nossa equipe vai falar com você pelo WhatsApp ' +
      'sobre a sua vaga na imersão — fique de olho nas mensagens.</p>' +
      '</div>';
  }

  // ── Navegação ────────────────────────────────────────────────────────────
  function escolher(chave, opcao) {
    estado.respostas[chave] = opcao;
    guardar();
    // Marca na hora e segue sozinho: uma resposta por tela, sem clique extra.
    desenhar();
    setTimeout(function () {
      if (!estado.enviando && !estado.concluido) avancar();
    }, 220);
  }

  function avancar() {
    if (estado.enviando) return;

    if (mostrandoIdentidade()) {
      if (estado.identidade.nome.trim().length < 2) return reclamar('Escreva seu nome.');
      if (!telefoneValido(estado.identidade.whatsapp)) return reclamar('WhatsApp com DDD, por favor.');
      estado.passo++;
      guardar();
      return desenhar();
    }

    var pergunta = perguntaDoPasso();
    if (pergunta && !estado.respostas[pergunta.chave]) return reclamar('Escolha uma opção para continuar.');

    if (estado.passo === totalDePassos() - 1) return enviar();
    estado.passo++;
    desenhar();
  }

  function voltar() {
    if (estado.passo === 0 || estado.enviando) return;
    estado.passo--;
    desenhar();
  }

  function reclamar(mensagem) {
    aviso.textContent = mensagem;
  }

  // ── Envio ────────────────────────────────────────────────────────────────
  function enviar() {
    estado.enviando = true;
    botaoAvancar.disabled = true;
    botaoAvancar.textContent = 'Enviando…';
    aviso.textContent = '';

    var corpo = {
      nome: estado.identidade.nome.trim(),
      email: (estado.identidade.email || '').trim(),
      whatsapp: estado.identidade.whatsapp,
      origem_formulario: 'aplicacao-site',
      pagina: window.location.href,
      website: '', // armadilha: robô preenche, gente não
    };
    Object.keys(estado.respostas).forEach(function (chave) {
      corpo[chave] = estado.respostas[chave];
    });

    fetch(ENDERECO_CRM, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo),
    })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('resposta ' + resposta.status);
        estado.concluido = true;
        try { localStorage.removeItem(CHAVE_MEMORIA); } catch (e) {}
        desenhar();
        if (REDIRECIONAR_APOS) setTimeout(function () { window.location.href = REDIRECIONAR_APOS; }, 1200);
      })
      .catch(function () {
        // A pessoa não pode ficar presa: mostra o erro e deixa tentar de novo,
        // com as respostas ainda na tela.
        estado.enviando = false;
        botaoAvancar.disabled = false;
        botaoAvancar.textContent = 'Tentar de novo';
        reclamar('Não consegui enviar agora. Toque em "Tentar de novo".');
      });
  }

  // ── Teclado: 1..9 escolhe, Enter continua ────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (estado.concluido) return;
    var dentro = document.getElementById('aplicacao-titan');
    if (!dentro) return;
    if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      return avancar();
    }
    if (mostrandoIdentidade()) return;
    var numero = parseInt(e.key, 10);
    var pergunta = perguntaDoPasso();
    if (pergunta && numero >= 1 && numero <= pergunta.opcoes.length) {
      escolher(pergunta.chave, pergunta.opcoes[numero - 1]);
    }
  });

  botaoAvancar.addEventListener('click', avancar);
  botaoVoltar.addEventListener('click', voltar);

  // ── Começo ───────────────────────────────────────────────────────────────
  estado.identidade = lerIdentidade();
  try {
    var memoria = JSON.parse(localStorage.getItem(CHAVE_MEMORIA) || '{}');
    if (memoria.respostas) estado.respostas = memoria.respostas;
  } catch (e) {}
  desenhar();
})();
</script>
